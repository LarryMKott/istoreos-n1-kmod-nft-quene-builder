name: Build kmod-nft-queue for iStoreOS (Phicomm N1)

# =============================================================================
#  为 iStoreOS 25.12 (amlogic/meson, 内核 6.12) 交叉编译 nftables 的 queue 模块
#  产物：nft_queue.ko + kmod-nft-queue 安装包
#
#  触发方式：
#    - Push 到 main 且改动 scripts/ docker/ .github/ 时
#    - 手动触发（可自定义分支 / 并行度 / Docker Hub 拉取）
# =============================================================================

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'docker/**'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      istoreos_branch:
        description: 'iStoreOS 源码分支'
        required: true
        default: 'istoreos-25.12'
      nproc:
        description: '并行编译度（GitHub runner 建议 2~4，过高会 OOM）'
        required: true
        default: '4'
      use_prebuilt_image:
        description: '从 GHCR 拉取预构建镜像（更快，镜像不存在则自动回退本地构建）'
        required: true
        type: boolean
        default: true

permissions:
  contents: write         # 创建 Release 需要
  packages: read          # 拉取 GHCR 上的预构建镜像需要

concurrency:
  group: build-nft-queue-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: istoreos-builder
  IMAGE_TAG: 25.12
  ISTOREOS_BRANCH: ${{ github.event.inputs.istoreos_branch || 'istoreos-25.12' }}
  NPROC: ${{ github.event.inputs.nproc || '4' }}
  USE_PREBUILT: ${{ github.event_name != 'workflow_dispatch' || inputs.use_prebuilt_image }}

jobs:
  build:
    name: Cross-compile nft_queue.ko
    runs-on: ubuntu-22.04
    timeout-minutes: 350          # 首次全量编译 toolchain 需 2~4 小时，给足预算

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ⚠️ Docker / OCI 镜像名必须全小写，而 github.repository 保留仓库原始大小写
      #    （本仓库 LarryMKott/...），直接拼会报 repository name must be lowercase。
      - name: 计算小写镜像名
        id: img
        run: |
          echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}/istoreos-builder" >> "$GITHUB_OUTPUT"

      - name: 释放磁盘空间（runner 默认只有 ~14G 可用，OpenWrt 全量构建需 25G+）
        run: |
          echo "===== 清理前 ====="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean
          docker image prune -af 2>/dev/null || true
          echo "===== 清理后 ====="; df -h /

      # ⚠️ 不能用 actions/cache@v4：它在 job 失败时 Post 步骤会被 skip，缓存直接丢失。
      #    这里显式 restore + save(always)，让一次 70 分钟编译下载的源码包能留到下一次。
      - name: 恢复构建缓存（dl 源码包 + ccache）
        id: dlcache
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/dl
            cache/ccache
          key: istoreos-${{ env.ISTOREOS_BRANCH }}-dl-${{ hashFiles('scripts/build-module.sh') }}
          restore-keys: |
            istoreos-${{ env.ISTOREOS_BRANCH }}-dl-

      - name: 准备构建目录（绑定到容器 /build）
        run: |
          mkdir -p build cache/dl cache/ccache out
          cp -v scripts/build-module.sh build/
          chmod +x build/build-module.sh
          ls -la build cache

      # ---------------------------------------------------------------------
      # 镜像：优先用预构建镜像，失败则本地构建
      # ---------------------------------------------------------------------
      - name: 登录 GHCR（读取预构建镜像）
        if: env.USE_PREBUILT == 'true'
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin || \
            echo "[!] GHCR 登录失败，将尝试匿名拉取"

      - name: 尝试拉取预构建镜像
        id: pull
        if: env.USE_PREBUILT == 'true'
        continue-on-error: true
        run: |
          IMG="${{ steps.img.outputs.ghcr }}:${{ env.IMAGE_TAG }}"
          echo "img=$IMG" >> "$GITHUB_OUTPUT"
          if docker pull "$IMG"; then
            docker tag "$IMG" "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
            echo "pulled=true" >> "$GITHUB_OUTPUT"
            echo "[i] 已使用预构建镜像: $IMG"
          else
            echo "pulled=false" >> "$GITHUB_OUTPUT"
            echo "[!] 预构建镜像不可用，改为本地构建"
          fi

      # Docker Hub 匿名拉取偶发 429（rate limit），失败时换镜像源重试
      - name: 预拉取基础镜像（带镜像源回退）
        if: steps.pull.outputs.pulled != 'true'
        run: |
          for src in \
            docker.io/library/debian:12-slim \
            mirror.gcr.io/library/debian:12-slim \
            public.ecr.aws/docker/library/debian:12-slim ; do
            echo "[i] 尝试: $src"
            if docker pull "$src"; then
              docker tag "$src" debian:12-slim
              echo "[i] 基础镜像就绪（来自 $src）"
              exit 0
            fi
            echo "[!] 失败，换下一个源"
          done
          echo "[x] 基础镜像全部拉取失败"; exit 1

      - name: 本地构建镜像（拉取失败时）
        if: steps.pull.outputs.pulled != 'true'
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -o pipefail
          docker build --progress=plain \
            -f docker/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            --build-arg TARGET_BRANCH=${{ env.ISTOREOS_BRANCH }} \
            . 2>&1 | tee docker-build.log
          echo "[i] 镜像构建完成"

      - name: 启动编译容器
        run: |
          docker run -d --name builder \
            --network host \
            -e BRANCH="${{ env.ISTOREOS_BRANCH }}" \
            -e NPROC="${{ env.NPROC }}" \
            -e OUT_DIR=/build/out \
            -e SRC_DIR=/build/istoreos \
            -e CCACHE_DIR=/build/ccache \
            -v "$PWD/build:/build" \
            -v "$PWD/out:/build/out" \
            -v "$PWD/cache/dl:/build/dl-cache" \
            -v "$PWD/cache/ccache:/build/ccache" \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            sleep infinity
          docker ps -a

      - name: 预置 dl 缓存（避免重复下载源码包）
        run: |
          docker exec builder bash -c '
            set -e
            mkdir -p /build/istoreos
            if [ -d /build/dl-cache ] && [ -n "$(ls -A /build/dl-cache 2>/dev/null)" ]; then
              echo "[i] 复用缓存的源码包"
              mkdir -p /build/istoreos/dl
              cp -rn /build/dl-cache/. /build/istoreos/dl/ 2>/dev/null || true
              ls /build/istoreos/dl | head
            else
              echo "[i] 无缓存，稍后全量下载"
            fi
          '

      - name: 环境自检
        run: |
          echo "===== 磁盘 ====="; df -h /
          echo "===== 内存 ====="; free -m
          echo "===== 容器内工具 ====="
          docker exec builder bash -lc 'set -x; git --version; make --version | head -1; nproc; df -h /build | tail -1' || true

      - name: 执行交叉编译
        run: |
          # ⚠️ 必须 pipefail：容器里 `script | tee log` 的退出码是 tee 的（恒 0），
          #    会把真实失败吞掉，只剩「上传产物: No files were found」这种二次报错。
          docker exec \
            -e BRANCH="${{ env.ISTOREOS_BRANCH }}" \
            -e NPROC="${{ env.NPROC }}" \
            builder bash -lc 'set -o pipefail; bash /build/build-module.sh 2>&1 | tee /build/build.log'

      - name: 编译日志摘要
        if: always()
        run: |
          for f in build/build.log build/feeds.log build/pahole.log; do
            [ -f "$f" ] || continue
            echo "===== $f（末 120 行）====="
            tail -120 "$f"
            echo
          done

      - name: 回写 dl 缓存
        if: always()
        run: |
          docker exec builder bash -c '
            if [ -d /build/istoreos/dl ] && [ -d /build/dl-cache ]; then
              cp -rn /build/istoreos/dl/. /build/dl-cache/ 2>/dev/null || true
            fi
          ' || true
          du -sh cache/dl || true

      - name: 保存构建缓存
        if: always() && steps.dlcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            cache/dl
            cache/ccache
          key: ${{ steps.dlcache.outputs.cache-primary-key }}

      - name: 校验产物 vermagic
        id: verify
        if: success()
        run: |
          echo "===== 产物列表（宿主 out/，与容器 /build/out 是同一目录）====="
          ls -la out/
          if ! ls out/*.ko >/dev/null 2>&1; then
            echo "::error::out/ 里没有 .ko —— 编译脚本可能成功但产物没落到挂载目录"
            exit 1
          fi
          echo
          echo "===== vermagic 校验（期望：6.12.x SMP mod_unload aarch64）====="
          for f in out/*.ko; do
            [ -f "$f" ] || continue
            echo "--- $f ---"
            strings "$f" | grep -E '^vermagic=' || echo "(未找到 vermagic)"
          done

          # 提取发布所需信息，供后面的 Release 步骤用
          KO="$(ls out/*.ko | head -1)"
          KVER="$(strings "$KO" | sed -n 's/^vermagic=\([^ ]*\).*/\1/p' | head -1)"
          BTF="$(readelf -S -W "$KO" | awk '$2==".BTF"{print $6}' | head -1)"
          TM="$(readelf -sW "$KO" | awk '$NF=="__this_module"{print $3}' | head -1)"
          echo "kver=${KVER:-unknown}"                 >> "$GITHUB_OUTPUT"
          echo "btf=${BTF:-NONE}"                      >> "$GITHUB_OUTPUT"
          echo "this_module=${TM:-NONE}"               >> "$GITHUB_OUTPUT"
          echo "[i] kernel=$KVER  .BTF=$BTF  __this_module=$TM"

      - name: 生成校验和与发布说明
        id: notes
        if: success()
        run: |
          ( cd out && rm -f SHA256SUMS.txt && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          # ⚠️ heredoc 未加引号 ⇒ 会做变量替换，因此正文里禁止出现反引号（会被当命令执行）
          cat > release-notes.md <<EOF
          # kmod-nft-queue for iStoreOS / Phicomm N1

          **nft_queue.ko** —— nftables 的 queue 模块，aarch64 交叉编译产物，
          用于 iStoreOS ${ISTOREOS_BRANCH}（内核 ${{ steps.verify.outputs.kver }}）。

          ## 产物

          | 文件 | 说明 |
          | --- | --- |
          | nft_queue.ko | 内核模块，直接 insmod，或放进 /lib/modules/\$(uname -r)/ |
          | kmod-nft-queue-*.apk | iStoreOS 25.12 安装包（apk add --allow-untrusted） |
          | SHA256SUMS.txt | 校验和 |

          ## 产物自检

          | 项 | 值 | 期望 |
          | --- | --- | --- |
          | vermagic | ${{ steps.verify.outputs.kver }} SMP mod_unload aarch64 | 与设备 uname -r 一致 |
          | .BTF 段 | ${{ steps.verify.outputs.btf }} | 非 NONE（否则 insmod Oops） |
          | __this_module | ${{ steps.verify.outputs.this_module }} | 1216 |

          ## 构建信息

          - iStoreOS 分支：${ISTOREOS_BRANCH}
          - 提交：${GITHUB_SHA}
          - Workflow run：[#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          安装与故障排查见仓库 README。
          EOF
          echo "----- release-notes.md -----"; cat release-notes.md

      - name: 创建 GitHub Release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="kmod-nft-queue-${ISTOREOS_BRANCH}-k${{ steps.verify.outputs.kver }}"
          echo "[i] release tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[i] Release 已存在，覆盖产物与说明"
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" out/* \
              --title "kmod-nft-queue · ${ISTOREOS_BRANCH} · kernel ${{ steps.verify.outputs.kver }}" \
              --notes-file release-notes.md \
              --latest
          fi
          echo "### Release: [$TAG](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url,assets --jq '.url, (.assets[] | .name+"  "+((.size/1024)|tostring)+" KB")'

      - name: 上传产物 Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kmod-nft-queue-${{ env.ISTOREOS_BRANCH }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 90

      # 失败可能发生在「镜像构建」阶段（此时容器还没起来，build.log 不存在），
      # 因此把镜像构建日志一并落盘并输出。
      - name: 失败时输出日志
        if: failure()
        run: |
          for f in docker-build.log build/pahole.log build/build.log; do
            [ -f "$f" ] || continue
            echo "===== $f（末 200 行）====="
            tail -200 "$f"
            echo
          done
          docker exec builder bash -c 'tail -200 /build/build.log' 2>/dev/null || true

      - name: 上传构建日志 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_number }}
          path: |
            docker-build.log
            build/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: 清理容器
        if: always()
        run: docker rm -f builder 2>/dev/null || true
